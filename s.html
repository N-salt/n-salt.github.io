<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171719">
  <title>노티나무 일정 공유</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111113; color: #f4f1e8; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(100% - 32px, 440px); padding: 28px; border: 1px solid #303034; border-radius: 24px; background: #1b1b1f; }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    p { color: #b9b8c0; line-height: 1.6; }
    #status { margin-top: 24px; padding: 16px; border-radius: 14px; background: #25252a; }
  </style>
</head>
<body>
  <main>
    <h1>노티나무 일정 공유</h1>
    <p>공유된 일정은 노티나무 앱에서 열어 바로 등록할 수 있어요.</p>
    <div id="status" role="status">앱이 설치되어 있는데 이 페이지가 보인다면, 링크를 다시 눌러 앱에서 열어 주세요.</div>
  </main>
</body>
</html>
