<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171719">
  <title>노티나무</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111113; color: #f4f1e8; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(100% - 40px, 520px); text-align: center; }
    h1 { font-size: 2rem; }
    p { color: #b9b8c0; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>노티나무</h1>
    <p>노티나무 일정 공유 링크를 열기 위한 페이지입니다.<br>공유받은 링크를 누르면 앱에서 일정을 등록할 수 있어요.</p>
  </main>
</body>
</html>
